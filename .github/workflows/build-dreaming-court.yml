name: Build Dreaming Court IPA

on:
  push:
    branches: [dreaming-court]
    paths:
      - "DreamingCourt/**"
      - ".github/workflows/build-dreaming-court.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DreamingCourt
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project DreamingCourt.xcodeproj \
            -scheme DreamingCourt \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/DreamingCourt.app
          test -d "$APP"
          test -f "$APP/web/index.html"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DreamingCourt.ipa Payload
          ls -lh DreamingCourt.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DreamingCourt-ipa
          path: DreamingCourt/DreamingCourt.ipa
          if-no-files-found: error

      - name: Attach IPA to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dreaming-court-${{ github.run_number }}"
          gh release create "$TAG" DreamingCourt.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "The Dreaming Court (build ${{ github.run_number }})" \
            --notes "Unsigned IPA of The Dreaming Court. Install by sideloading (Sideloadly or AltStore) with your own Apple ID."
