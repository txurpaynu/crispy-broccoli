name: Build Quest APK

on:
  push:
    paths: ["quest/**", ".github/workflows/build-quest-apk.yml"]
  pull_request:
    paths: ["quest/**", ".github/workflows/build-quest-apk.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"
  VENDORS_TAG: "3.1.2-stable"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-vendors-${{ env.VENDORS_TAG }}

      - name: Install Godot, export templates and the Meta OpenXR plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          C="$RUNNER_TEMP/godot-cache"
          mkdir -p "$C"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          [ -f "$C/godot.zip" ] || curl -sSLfo "$C/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          [ -f "$C/templates.tpz" ] || curl -sSLfo "$C/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          [ -f "$C/godotopenxrvendorsaddon.zip" ] || gh release download "$VENDORS_TAG" -R GodotVR/godot_openxr_vendors --pattern 'godotopenxrvendorsaddon.zip' -D "$C"
          cd "$RUNNER_TEMP"
          unzip -q -o "$C/godot.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q -o "$C/templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p vx && (cd vx && unzip -q -o "$C/godotopenxrvendorsaddon.zip")
          mkdir -p "$GITHUB_WORKSPACE/quest/addons"
          cp -r "$(find vx -type d -name godotopenxrvendors | head -n 1)" "$GITHUB_WORKSPACE/quest/addons/"
          godot --version

      - name: Configure Android export (SDK path and debug keystore)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/quest/android-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # Install the Android Gradle build template (what "Project > Install Android Build Template" does).
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Import project
        run: |
          godot --headless --import 2>&1 | tee "$RUNNER_TEMP/import.log" | tail -n 30
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/import.log"; then
            echo "::error::Script errors during import"; exit 1
          fi

      - name: Smoke test (runs every behaviour for 70 simulated seconds without a headset)
        run: |
          godot --headless --fixed-fps 30 --quit-after 2100 res://scenes/main.tscn -- --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log" | grep -E "^\[|ERROR|error" | grep -v OpenXR-Loader | head -n 200
          if grep -E "SCRIPT ERROR|Parse Error|Invalid (call|access|get|set|assignment|operands)|Cannot call|Nonexistent function|Failed to load script" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::Script errors in the smoke test"; exit 1
          fi
          grep -q "\[smoke\]" "$RUNNER_TEMP/smoke.log" || { echo "::error::Smoke test did not run"; exit 1; }

      - name: Export debug APK
        run: |
          mkdir -p ../build
          godot --headless --export-debug "Quest" ../build/vexley-quest.apk 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 80
          test -f ../build/vexley-quest.apk || { echo "::error::APK was not created"; exit 1; }
          ls -la ../build

      - name: Check the APK manifest (passthrough, room scan, Quest launcher)
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt
          "$AAPT" dump badging ../build/vexley-quest.apk | head -n 20
          "$AAPT" dump xmltree ../build/vexley-quest.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -E "PASSTHROUGH|USE_SCENE|USE_ANCHOR|supportedDevices|IMMERSIVE|com.oculus|openxr" "$RUNNER_TEMP/manifest.txt" | sed 's/^ *//' | sort -u
          for need in com.oculus.feature.PASSTHROUGH com.oculus.permission.USE_SCENE; do
            grep -q "$need" "$RUNNER_TEMP/manifest.txt" || { echo "::error::$need missing from the manifest"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vexley-quest-apk
          path: build/vexley-quest.apk
          if-no-files-found: error
