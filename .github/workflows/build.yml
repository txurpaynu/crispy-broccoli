name: Build IPA
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SecondsClock.xcodeproj -target SecondsClock \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > build.log 2>&1 || { grep -E "error:|fatal" build.log | sort -u | head -30 | while read -r l; do echo "::error::$l"; done; tail -40 build.log; exit 1; }
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SecondsClock.app Payload/
          zip -qry SecondsClock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SecondsClock-ipa
          path: SecondsClock.ipa
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view seconds-clock-latest >/dev/null 2>&1 || \
            gh release create seconds-clock-latest --target "$GITHUB_SHA" \
              --title "Seconds Clock (latest build)" --notes "Unsigned IPA. Install with Sideloadly, AltStore or TrollStore."
          gh release upload seconds-clock-latest SecondsClock.ipa --clobber
