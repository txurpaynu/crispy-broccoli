name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SecondsClock.xcodeproj -target SecondsClock \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SecondsClock.app Payload/
          zip -qry SecondsClock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SecondsClock-ipa
          path: SecondsClock.ipa
