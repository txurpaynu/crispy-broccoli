name: Fetch CC0 assets (Poly Haven)

on:
  push:
    paths:
      - "OldBroken/tools/assets/manifest.json"
      - ".github/workflows/fetch-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Catalog + download
        run: python3 OldBroken/tools/assets/fetch_polyhaven.py

      - name: Convert models to USDZ with Blender
        run: |
          LIST=OldBroken/tools/assets/downloads/list.txt
          if [ -s "$LIST" ]; then
            curl -sSL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C /tmp
            sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 >/dev/null
            /tmp/blender-4.2.3-linux-x64/blender -b --python OldBroken/tools/assets/blender_to_usdz.py -- "$LIST" OldBroken/OldBroken/Resources/Models
          fi
          rm -rf OldBroken/tools/assets/downloads

      - name: Commit assets back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A OldBroken/tools/assets OldBroken/OldBroken/Resources
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Fetch CC0 assets from Poly Haven [skip ci]"
          git push
