name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests (simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project TXAWPAY.xcodeproj -scheme TXAWPAY \
            -destination "id=$SIM" \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project TXAWPAY.xcodeproj -scheme TXAWPAY \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TXAWPAY.app Payload/
          zip -qry TXAWPAY-unsigned.ipa Payload
          ls -lh TXAWPAY-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TXAWPAY-unsigned-ipa
          path: TXAWPAY-unsigned.ipa
