<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Dreaming Court">
<meta name="theme-color" content="#000000">
<title>The Dreaming Court</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a sleepy, grinning castle you can walk around in.
   IDEA: a handheld game console: screen on top, controls below, like a pocket cartridge.
   PICTURE: the live 480x300 pixel overworld (and 640x400 cutscenes) — the game is the picture.
   COLOUR and TYPE: black, lattice red #ea3352, bone #fdf1e9, crown gold #fced57; Pixelify Sans.
   LAYOUT: console body centred; screen, then dialogue overlay inside it, then d-pad + A/B; endings list underneath. */
:root{color-scheme:dark;--bg:#000;--ink:#fdf1e9;--red:#ea3352;--plum:#742b51;--gold:#fced57;--dim:#a89aa0}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--ink);font:17px/1.5 "Pixelify Sans",system-ui,sans-serif;overflow-x:clip}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 background-color:#000;background-image:repeating-linear-gradient(45deg,transparent 0 11px,#742b51 11px 12px),repeating-linear-gradient(-45deg,transparent 0 11px,#742b51 11px 12px)}
.console{max-width:880px;margin:0 auto;padding:10px 10px 18px}
.screen{position:relative;border:4px solid var(--ink);box-shadow:0 0 0 4px #000,0 0 0 8px var(--red);background:#000;aspect-ratio:16/10;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;justify-content:space-between;font-size:13px;pointer-events:none}
.hud span{background:#000d;border:2px solid var(--red);padding:0 6px;white-space:nowrap}
.hud .r{display:flex;gap:6px}
#dlg{position:absolute;left:6px;right:6px;bottom:6px;background:#000;border:3px solid var(--ink);padding:10px 12px 12px;max-height:72%;overflow:auto;cursor:pointer}
#dwho{display:inline-block;background:var(--red);border:2px solid var(--ink);padding:0 8px;font-size:14px;margin:-2px 0 6px;font-weight:700}
#dtxt{white-space:pre-line;font-size:clamp(14px,2.4vw,19px);min-height:2.6em}
#dch{display:grid;gap:6px;margin-top:8px}
#dch button,.tbtn{font:inherit;font-size:clamp(14px,2.2vw,17px);text-align:left;color:var(--ink);background:#000;border:3px solid var(--ink);padding:6px 10px;min-height:44px;cursor:pointer;display:flex;gap:10px;align-items:center}
#dch button b{flex:none;width:24px;height:24px;display:grid;place-items:center;background:var(--ink);color:#000;font-size:14px}
#dch button.sel,#dch button:hover,.tbtn:hover,.tbtn:focus-visible{background:var(--red);border-color:var(--gold);outline:none}
#dch button.locked{opacity:.5}#dch em{font-style:normal;color:var(--dim);font-size:14px}
#din{margin-top:8px}#dq{color:var(--gold);font-size:15px;margin-bottom:4px}#din .row{display:flex;gap:8px}
#dans{flex:1;font:inherit;font-size:16px;background:#000;color:var(--ink);border:3px solid var(--ink);padding:6px 10px;min-height:44px}
#dans:focus{outline:none;border-color:var(--gold)}#din button{font:inherit;background:var(--red);color:var(--ink);border:3px solid var(--ink);padding:0 14px}
#title{position:absolute;left:0;right:0;bottom:0;padding:10px;display:grid;gap:8px;justify-items:center}
#title .tbtn{width:min(320px,90%);justify-content:center;background:#000e}#title .tbtn em{font-style:normal;color:var(--dim);font-size:13px}
#title .tbtn:disabled{opacity:.55;cursor:not-allowed}
#menu{position:absolute;inset:12% 14%;background:#000;border:3px solid var(--gold);padding:12px 16px;overflow:auto}
#menu h3{margin:0 0 6px;color:var(--gold)}#menu p{margin:4px 0}#menu .dim{color:var(--dim);font-size:14px}#menu .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seal{display:inline-block;width:16px;height:16px;border:2px solid var(--ink);margin-right:4px;vertical-align:middle}.seal.red{background:var(--red)}.seal.white{background:var(--ink)}.seal.black{background:#000;outline:2px solid var(--red)}.seal.none{opacity:.3}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:0}
.dpad button{background:#111;border:3px solid var(--ink);color:var(--ink);font:inherit;font-size:20px;touch-action:none}
.dpad button.on{background:var(--red)}.dpad .c{background:#000;border:0}
.ab{display:grid;grid-template-columns:auto auto;gap:12px;align-items:center}
.ab button{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);font:inherit;font-size:24px;font-weight:700;color:var(--ink);touch-action:none}
#btnA{background:var(--red);transform:translateY(-16px)}#btnB{background:#111}
#btnRun{grid-column:1/3;height:40px;width:auto;border-radius:20px;font-size:15px;background:#000}#btnRun.on{background:var(--gold);color:#000}
.keys{color:var(--dim);font-size:14px;text-align:center;margin:10px 0 0}
.band{max-width:880px;margin:0 auto;padding:26px 10px}
h2{font-size:30px;line-height:1.05;margin:0 0 6px}.lead{color:var(--dim);margin:0 0 14px}
.ends{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.end{border:3px dashed var(--dim);padding:10px 12px;color:var(--dim);background:#000}.end.got{border:3px solid var(--gold);color:var(--ink)}
.end h3{margin:0 0 2px;font-size:18px}.end p{margin:0;font-size:14px}
@media(hover:hover) and (pointer:fine){.pad{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="console">
 <div class="screen" id="screen">
  <canvas id="ow" width="480" height="300" aria-label="Game"></canvas>
  <canvas id="cv" width="640" height="400" hidden aria-label="Cutscene"></canvas>
  <div class="hud" id="hud" hidden><span id="hudRoom">—</span><div class="r"><span id="hudTime" hidden>3:12</span><span id="hudLuc">Lucidity 0</span></div></div>
  <div id="title"><button class="tbtn" id="tNew">New dream<em></em></button><button class="tbtn" id="tCont" hidden>Continue your dream</button><button class="tbtn" id="tDaily">Daily Dream<em></em></button></div>
  <div id="dlg" hidden><div id="dwho" hidden></div><div id="dtxt"></div><form id="din" hidden><div id="dq"></div><div class="row"><input id="dans" autocomplete="off" autocapitalize="off" spellcheck="false"><button>OK</button></div></form><div id="dch"></div></div>
  <div id="menu" hidden><h3>Dream</h3><div id="mbody"></div><div class="row"><button class="tbtn" id="mClose">Back</button><button class="tbtn" id="mQuit">Save &amp; quit to title</button></div></div>
 </div>
 <div class="pad" aria-label="Touch controls">
  <div class="dpad"><span class="c"></span><button data-pad="up" aria-label="Up">▲</button><span class="c"></span><button data-pad="left" aria-label="Left">◀</button><span class="c"></span><button data-pad="right" aria-label="Right">▶</button><span class="c"></span><button data-pad="down" aria-label="Down">▼</button><span class="c"></span></div>
  <div class="ab"><button id="btnB" aria-label="Menu">B</button><button id="btnA" aria-label="Talk / look">A</button><button id="btnRun">RUN</button></div>
 </div>
 <p class="keys">Arrows / WASD move · Z or Enter talk &amp; look · X or Esc menu · hold Shift to run</p>
</div>
<section class="band"><h2>Endings</h2><p class="lead" id="endc"></p><div class="ends" id="ends"></div></section>

const LUT=new Uint8Array(32768);for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){let best=0,bd=1e9;const R0=r*8+4,G0=g*8+4,B0=b*8+4;
 PALC.forEach((p,i)=>{const dr=R0-p[0],dg=G0-p[1],db=B0-p[2];const d=dr*dr*3+dg*dg*4+db*db*2;if(d<bd){bd=d;best=i}});LUT[(r<<10)|(g<<5)|b]=best}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v/16-.47)*34);
function quantize(){const im=x.getImageData(0,0,W,H),d=im.data;
 for(let y=0;y<H;y++){const by=(y&3)<<2;for(let xx=0;xx<W;xx++){const i=(y*W+xx)<<2,o=BAY[by|(xx&3)];
  let r=d[i]+o,g=d[i+1]+o,b=d[i+2]+o;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;
  const p=PALC[LUT[((r>>3)<<10)|((g>>3)<<5)|(b>>3)]];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255}}
 x.putImageData(im,0,0)}

 for(const [m,px,py,tt,sc,clip] of KQ){x.save();if(clip){x.beginPath();x.rect(...clip);x.clip()}king(x,m,px,py,tt,sc);x.restore()}}

function bg(n){const im=BG[n];if(im&&im.complete)x.drawImage(im,0,0);else rect(K,0,0,W,H)}
function spr(n,px,py,ctx=x){const m=ATLAS_META[n];if(!m||!ATLAS.complete)return;ctx.drawImage(ATLAS,m[0],m[1],m[2],m[3],Math.round(px),Math.round(py),m[2],m[3])}
function sprC(n,cx,cy){const m=ATLAS_META[n];if(m)spr(n,cx-(m[2]>>1),cy-(m[3]>>1))}
function eye(r,cx,cy,t,seed=0){const per=3200+seed*370,ph=(t+seed*911)%per;if(ph<140){sprC(`eye${r}_c`,cx,cy);return}
 const l=Math.round(Math.sin((t+seed*500)/900)*2)+2;sprC(`eye${r}_${l}`,cx,cy)}
function twinkle(t,x0,y0,w,h,n,seed=1){for(let i=0;i<n;i++){const sx=x0+((i*137+seed*71)%w),sy=y0+((i*89+seed*13)%h);const on=((t/260+i*1.7)|0)%5;
 if(on==0){rect(C,sx,sy,1,1);rect(LV,sx-1,sy,1,1);rect(LV,sx+1,sy,1,1);rect(LV,sx,sy-1,1,1);rect(LV,sx,sy+1,1,1)}else if(on<3)rect(S,sx,sy,1,1)}}
function pline(x0,y0,x1,y1,w,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
 x.fillStyle=col;for(;;){x.fillRect(x0-(w>>1),y0-(w>>1),w,w);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function pz(px,py,sc,col){const Z=['111','001','010','100','111'];Z.forEach((r,j)=>[...r].forEach((v,i)=>{if(v=='1')rect(col,px+i*sc,py+j*sc,sc,sc)}))}
function checker(a,b,w,h,s,c1,c2,o=0){for(let j=0;j*s<h;j++)for(let i=0;i*s<w;i++){x.fillStyle=(i+j+o)%2?c1:c2;x.fillRect(a+i*s,b+j*s,Math.min(s,w-i*s),Math.min(s,h-j*s))}}

 for(let i=0;i<46;i++){const sp=40+(i*37)%90;const sz=[12,20,32,48][i%4];const yy=H+60-((t/1000*sp*2.4+i*97)%(H+120));const xx=((i*173)%(W+40))-20+Math.round(Math.sin(t/700+i)*6);spr(`tile${sz}_${i%3}`,xx,yy)}

 spr(`gearA_${((t/160)|0)%6}`,90-67,320-67);spr(`gearB_${5-((t/130)|0)%6}`,560-49,90-49);spr(`gearC_${((t/100)|0)%6}`,560-35,330-35);
