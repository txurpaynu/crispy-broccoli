name: ShimejiCompanion

options:
  bundleIdPrefix: com.shimeji
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ShimejiCompanion:
    type: application
    platform: iOS
    sources:
      - path: ShimejiCompanion
        excludes:
          - "Sprites/README.md"
      - path: Shared
    dependencies:
      - target: CompanionWidget
      - target: SafariWebExtension
    info:
      path: ShimejiCompanion/Info.plist
      properties:
        CFBundleDisplayName: Shimeji
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.shimeji.companion
            CFBundleURLSchemes:
              - shimeji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimeji.companion
        PRODUCT_NAME: ShimejiCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  CompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CompanionWidget
      - path: Shared
    info:
      path: CompanionWidget/Info.plist
      properties:
        CFBundleDisplayName: Shimeji Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimeji.companion.widget
        PRODUCT_NAME: CompanionWidget
        SKIP_INSTALL: YES

  SafariWebExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Vexley Safari
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimeji.companion.safari
        PRODUCT_NAME: SafariWebExtension
        SKIP_INSTALL: YES
